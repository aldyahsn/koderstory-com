<article class="card h-100">
    {% if card.image %}
    <img
        src="{{ card.image.url }}"
        class="card-img-top ks-card-image"
        alt="{{ card.image_alt|default:card.title }}"
    >
    {% else %}
    <div class="ks-card-image bg-body-tertiary border-bottom d-flex align-items-center justify-content-center text-secondary">
        <div class="text-center px-3">
            <div class="small text-uppercase mb-1">Image placeholder</div>
            <div>Card visual</div>
        </div>
    </div>
    {% endif %}

    <div class="card-body p-4">
        {% if card.eyebrow %}
        <p class="small text-secondary mb-2">{{ card.eyebrow }}</p>
        {% endif %}
        <h3 class="h4">{{ card.title }}</h3>
        <p class="text-secondary">{{ card.description|linebreaksbr }}</p>

        {% if card.button_label %}
        <a href="{{ card.button_url|default:'#contact' }}" class="btn btn-outline-dark">
            {{ card.button_label|default:button_text }}
        </a>
        {% endif %}
    </div>
</article>
