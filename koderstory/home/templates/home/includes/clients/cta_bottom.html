<section id="{{ page.clients_anchor_id|default:'clients' }}" class="py-5 bg-white ks-clients-cta-bottom">
    <div class="container py-4">
        <div class="ks-client-logo-row mb-5">
            {% for client in page.client_logos.all %}
            {% include "home/includes/clients/logo_item.html" with client=client %}
            {% endfor %}
        </div>
        {% if page.clients_title %}
        <p class="ks-client-pill mx-auto mb-0">
            {{ page.clients_title }}
            {% if page.clients_eyebrow %}
            <span>{{ page.clients_eyebrow }}</span>
            {% endif %}
        </p>
        {% endif %}
    </div>
</section>
