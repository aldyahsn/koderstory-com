<section id="{{ page.clients_anchor_id|default:'clients' }}" class="py-5 bg-white ks-clients-split-grid">
    <div class="container py-4">
        <div class="row align-items-center g-5">
            <div class="col-lg-5">
                {% if page.clients_eyebrow %}
                <p class="text-uppercase small text-secondary mb-3">{{ page.clients_eyebrow }}</p>
                {% endif %}
                <h2 class="display-5 mb-0">{{ page.clients_title }}</h2>
            </div>
            <div class="col-lg-7">
                <div class="row row-cols-2 g-4">
                    {% for client in page.client_logos.all %}
                    <div class="col">
                        {% include "home/includes/clients/logo_item.html" with client=client boxed=True %}
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
