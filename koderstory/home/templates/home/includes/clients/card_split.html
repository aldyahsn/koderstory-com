<section id="{{ page.clients_anchor_id|default:'clients' }}" class="py-5 ks-clients-card-split">
    <div class="container">
        <div class="card mb-5">
            <div class="card-body p-4">
                <div class="row align-items-center g-4">
                    <div class="col-lg-3">
                        {% if page.clients_eyebrow %}
                        <p class="text-uppercase small text-secondary mb-2">{{ page.clients_eyebrow }}</p>
                        {% endif %}
                        <h2 class="h5 mb-0">{{ page.clients_title }}</h2>
                    </div>
                    <div class="col-lg-9">
                        <div class="row row-cols-2 row-cols-md-4 g-3">
                            {% for client in page.client_logos.all %}
                            <div class="col">
                                <div class="border rounded p-4 text-center text-secondary">
                                    {{ client.name }}
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
