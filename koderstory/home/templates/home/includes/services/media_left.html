<section id="{{ page.services_anchor_id|default:'services' }}" class="py-5 bg-white ks-services-media-left">
    <div class="container py-4">
        <div class="row align-items-center g-5">
            <div class="col-lg-6 order-lg-1">
                {% include "home/includes/services/preview_panel.html" with variant="light" %}
            </div>
            <div class="col-lg-5 offset-lg-1 order-lg-2">
                {% include "home/includes/services/section_heading.html" %}
                <div class="ks-service-feature-list mt-4">
                    {% for card in page.service_cards.all|slice:":3" %}
                    {% include "home/includes/services/feature_item.html" with card=card %}
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
