{% if page.cta_kicker %}
<p class="text-uppercase small {% if dark %}text-indigo{% else %}text-secondary{% endif %} mb-3">{{ page.cta_kicker }}</p>
{% endif %}
<h2 class="{% if dark %}text-white {% endif %}display-5 mb-3">{{ page.cta_title }}</h2>
{% if page.cta_description %}
<p class="lead {% if dark %}text-white-50{% else %}text-secondary{% endif %} mb-0">{{ page.cta_description|linebreaksbr }}</p>
{% endif %}
