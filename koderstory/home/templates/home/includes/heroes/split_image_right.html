<section id="{{ page.hero_anchor_id|default:'hero' }}" class="ks-hero ks-hero-split bg-white border-bottom">
    <div class="container py-5">
        <div class="row align-items-center g-5">
            <div class="col-lg-7">
                {% if page.hero_eyebrow %}
                <p class="text-uppercase small text-secondary mb-3">{{ page.hero_eyebrow }}</p>
                {% endif %}
                <h1 class="display-4 mb-4">{{ page.hero_title }}</h1>
                <p class="lead text-secondary mb-4">{{ page.hero_description|linebreaksbr }}</p>
                {% include "home/includes/hero_buttons.html" %}
            </div>

            <div class="col-lg-5">
                {% include "home/includes/hero_image.html" %}
            </div>
        </div>
    </div>
</section>
