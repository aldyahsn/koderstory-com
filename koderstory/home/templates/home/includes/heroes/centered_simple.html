<section id="{{ page.hero_anchor_id|default:'hero' }}" class="ks-hero ks-hero-centered-simple bg-white border-bottom">
    <div class="container py-5">
        <div class="text-center mx-auto ks-hero-copy">
            {% if page.hero_eyebrow %}
            <p class="text-uppercase small text-secondary mb-3">{{ page.hero_eyebrow }}</p>
            {% endif %}
            <h1 class="display-4 mb-4">{{ page.hero_title }}</h1>
            <p class="lead text-secondary mb-4">{{ page.hero_description|linebreaksbr }}</p>
            {% include "home/includes/hero_buttons.html" with center=True %}
        </div>
    </div>
</section>
