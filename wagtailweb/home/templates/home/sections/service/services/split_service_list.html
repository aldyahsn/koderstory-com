<section id="{{ page.services_anchor_id|default:'services' }}" class="ks-section ks-height-{{ page.services_section_height }}" data-ks-vertical="{{ page.services_vertical_alignment }}"{% if page.services_style %} style="{{ page.services_style }}"{% endif %}>
    <div class="container ks-container" data-ks-width="{{ page.services_content_width }}">
        <div class="row g-5">
            <div class="col-lg-4">{% include "home/components/service_section_heading.html" %}</div>
            <div class="col-lg-8">
                <div class="ks-service-list">
                    {% for service in page.service_items.all %}
                    {% include "home/components/service_card.html" %}
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
