{% if page.clients_primary_button_label or page.clients_secondary_button_label %}
<div class="d-flex flex-wrap gap-3 mt-4">
    {% if page.clients_primary_button_label %}
    <a class="btn btn-primary" href="{{ page.clients_primary_button_url|default:'#' }}">{{ page.clients_primary_button_label }}</a>
    {% endif %}
    {% if page.clients_secondary_button_label %}
    <a class="btn btn-link text-decoration-none" href="{{ page.clients_secondary_button_url|default:'#' }}">{{ page.clients_secondary_button_label }} <span aria-hidden="true">→</span></a>
    {% endif %}
</div>
{% endif %}
