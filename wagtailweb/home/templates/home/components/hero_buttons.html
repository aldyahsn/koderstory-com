{% if page.hero_primary_button_label or page.hero_secondary_button_label %}
<div class="d-flex flex-wrap gap-3 mt-4 ks-buttons">
    {% if page.hero_primary_button_label %}
    <a class="btn btn-primary" href="{{ page.hero_primary_button_url|default:'#' }}">{{ page.hero_primary_button_label }}</a>
    {% endif %}
    {% if page.hero_secondary_button_label %}
    <a class="btn btn-secondary" href="{{ page.hero_secondary_button_url|default:'#' }}">{{ page.hero_secondary_button_label }} <span aria-hidden="true">→</span></a>
    {% endif %}
</div>
{% endif %}
