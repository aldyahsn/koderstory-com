{% load wagtailcore_tags %}
{% if page.features_testimonial_quote %}
<figure class="ks-testimonial mt-5 mb-0">
    <blockquote class="mb-3">{{ page.features_testimonial_quote|richtext }}</blockquote>
    <figcaption class="d-flex align-items-center gap-3">
        {% if page.features_testimonial_avatar %}
        <img src="{{ page.features_testimonial_avatar.url }}" alt="{{ page.features_testimonial_name }}">
        {% endif %}
        <span><strong>{{ page.features_testimonial_name }}</strong>{% if page.features_testimonial_role %} — {{ page.features_testimonial_role }}{% endif %}</span>
    </figcaption>
</figure>
{% endif %}
