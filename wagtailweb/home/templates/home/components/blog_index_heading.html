{% load wagtailcore_tags %}
<div class="ks-copy mb-5">
    {% if page.blog_eyebrow %}<p class="ks-eyebrow mb-3">{{ page.blog_eyebrow }}</p>{% endif %}
    {% if page.blog_title %}<h2 class="display-5 mb-3">{{ page.blog_title }}</h2>{% endif %}
    {% if page.blog_description %}<div class="lead text-secondary mb-0">{{ page.blog_description|richtext }}</div>{% endif %}
</div>
