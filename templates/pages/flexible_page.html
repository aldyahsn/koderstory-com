{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block body_class %}template-flexible{% endblock %}

{% block content %}
  {% if page.intro %}
    <section class="site-section scheme-white section-spacing-compact">
      <div class="site-container container-narrow">
        <h1>{{ page.title }}</h1>
        <div class="rich-text">{{ page.intro|richtext }}</div>
      </div>
    </section>
  {% endif %}
  {% for block in page.body %}
    {% include_block block %}
  {% endfor %}
{% endblock %}
