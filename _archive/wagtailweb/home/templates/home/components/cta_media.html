{% load wagtailimages_tags %}
<div class="ks-media-frame ks-cta-media">
    {% if page.cta_image %}
    {% image page.cta_image width-1200 class="w-100 h-100" alt=page.cta_image_alt|default:page.cta_title %}
    {% else %}
    <div class="ks-media-placeholder" role="img" aria-label="CTA image placeholder"><span>CTA media</span></div>
    {% endif %}
</div>
